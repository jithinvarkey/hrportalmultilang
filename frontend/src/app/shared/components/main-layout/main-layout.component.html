<div class="app-shell" [class.sidebar-collapsed]="!sidebarOpen">

  <svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
    <defs>
      <linearGradient id="logo-fill" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#3b82f6"/>
        <stop offset="100%" stop-color="#6366f1"/>
      </linearGradient>
      <linearGradient id="logo-shine" x1="0%" y1="0%" x2="60%" y2="100%">
        <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <symbol id="hrms-diamond" viewBox="0 0 30 30">
        <polygon points="15,2 28,12 15,28 2,12" fill="url(#logo-fill)"/>
        <polygon points="15,2 8,12 15,12"        fill="url(#logo-shine)"/>
        <polygon points="15,2 22,12 15,12"        fill="rgba(255,255,255,0.12)"/>
        <line x1="2"  y1="12" x2="28" y2="12" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>
        <line x1="15" y1="2"  x2="2"  y2="12" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
      </symbol>
    </defs>
  </svg>

  <aside class="sidebar">
    <div class="sidebar-top">

      <div class="brand" *ngIf="sidebarOpen">
        <div class="brand-icon">
          <svg class="diamond-svg" aria-label="HRMS logo"><use href="#hrms-diamond"/></svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">HRMS</div>
          <div class="portal-badge"
               [style.color]="portalInfo.color"
               [style.background]="portalInfo.color + '18'">
            <mat-icon>{{ portalInfo.icon }}</mat-icon>{{ portalInfo.label }}
          </div>
        </div>
      </div>

      <div class="brand brand-mini" *ngIf="!sidebarOpen">
        <div class="brand-icon">
          <svg class="diamond-svg" aria-label="HRMS logo"><use href="#hrms-diamond"/></svg>
        </div>
      </div>

      <button class="toggle-btn" (click)="toggleSidebar()">
        <mat-icon>{{ sidebarOpen ? 'menu_open' : 'menu' }}</mat-icon>
      </button>
    </div>

    <nav class="nav-list">
      <ng-container *ngFor="let group of navGroups">
        <div class="nav-section-label" *ngIf="group.label && sidebarOpen">{{ group.label }}</div>
        <div class="nav-section-divider" *ngIf="group.label && !sidebarOpen"></div>
        <a *ngFor="let item of group.items"
           class="nav-link"
           [routerLink]="[item.path]"
           routerLinkActive="nav-active"
           [routerLinkActiveOptions]="{exact: true}">
          <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
          <span class="nav-text" *ngIf="sidebarOpen">{{ item.label }}</span>
        </a>
      </ng-container>
    </nav>

    <!-- Footer expanded -->
    <div class="sidebar-footer" *ngIf="sidebarOpen">

      <!-- Theme picker -->
      <div class="theme-picker">
        <span class="theme-picker-label">Theme</span>
        <div class="theme-dots">
          <button *ngFor="let t of themes"
                  class="theme-dot"
                  [class.active]="themeService.current() === t.id"
                  [style.background]="t.color"
                  [matTooltip]="t.label"
                  matTooltipPosition="above"
                  (click)="setTheme(t.id)">
          </button>
        </div>
      </div>

      <!-- Notification bell -->
      <div class="notif-wrap">
        <button class="notif-btn" (click)="toggleNotifications()" matTooltip="Notifications">
          <mat-icon>notifications</mat-icon>
          <span class="notif-badge" *ngIf="unreadCount">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
        </button>
        <div class="notif-dropdown" *ngIf="showNotifications">
          <div class="nd-head">
            <span>Notifications</span>
            <button class="nd-readall" *ngIf="unreadCount" (click)="markAllNotificationsRead()">Mark all read</button>
          </div>
          <div class="nd-list">
            <button class="nd-item" *ngFor="let n of notifications" [class.unread]="!n.read_at"
                    (click)="openNotification(n)">
              <mat-icon class="nd-ic">{{ n.type === 'policy' || n.type === 'policy_review' ? 'policy' : 'campaign' }}</mat-icon>
              <div class="nd-body">
                <div class="nd-title">{{ n.title }}</div>
                <div class="nd-text" *ngIf="n.body">{{ n.body }}</div>
                <div class="nd-time">{{ n.created_at | date:'MMM d, h:mm a' }}</div>
              </div>
              <span class="nd-dot" *ngIf="!n.read_at"></span>
            </button>
            <div class="nd-empty" *ngIf="!notifications.length">
              <mat-icon>notifications_none</mat-icon>
              <span>No notifications</span>
            </div>
          </div>
        </div>
      </div>

      <!-- User -->
      <div class="user-card">
        <button class="user-trigger" (click)="goToProfile()" matTooltip="View profile">
          <div class="user-avatar">{{ userInitials }}</div>
          <div class="user-info">
            <div class="user-name">{{ user?.name }}</div>
            <div class="user-role">{{ roleLabel }}</div>
          </div>
        </button>
        <button class="profile-btn" matTooltip="My Profile" (click)="goToProfile()">
          <mat-icon>account_circle</mat-icon>
        </button>
        <button class="logout-btn" matTooltip="Logout" (click)="logout()">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </div>

    <!-- Footer collapsed -->
    <div class="sidebar-footer-mini" *ngIf="!sidebarOpen">
      <button class="mini-btn" matTooltip="Change theme" (click)="cycleTheme()">
        <mat-icon>palette</mat-icon>
      </button>
      <div class="notif-wrap mini-notif-wrap">
        <button class="mini-btn notif-mini-btn" (click)="toggleNotifications()" matTooltip="Notifications">
          <mat-icon>notifications</mat-icon>
          <span class="notif-badge" *ngIf="unreadCount">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
        </button>
        <div class="notif-dropdown mini-dropdown" *ngIf="showNotifications">
          <div class="nd-head">
            <span>Notifications</span>
            <button class="nd-readall" *ngIf="unreadCount" (click)="markAllNotificationsRead()">Mark all read</button>
          </div>
          <div class="nd-list">
            <button class="nd-item" *ngFor="let n of notifications" [class.unread]="!n.read_at"
                    (click)="openNotification(n)">
              <mat-icon class="nd-ic">{{ n.type === 'policy' || n.type === 'policy_review' ? 'policy' : 'campaign' }}</mat-icon>
              <div class="nd-body">
                <div class="nd-title">{{ n.title }}</div>
                <div class="nd-text" *ngIf="n.body">{{ n.body }}</div>
                <div class="nd-time">{{ n.created_at | date:'MMM d, h:mm a' }}</div>
              </div>
              <span class="nd-dot" *ngIf="!n.read_at"></span>
            </button>
            <div class="nd-empty" *ngIf="!notifications.length">
              <mat-icon>notifications_none</mat-icon>
              <span>No notifications</span>
            </div>
          </div>
        </div>
      </div>
      <button class="mini-btn" matTooltip="My Profile" (click)="goToProfile()">
        <mat-icon>account_circle</mat-icon>
      </button>
      <button class="logout-btn-mini" matTooltip="Logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
      </button>
      <button class="profile-avatar-mini" matTooltip="{{ user?.name }} — View profile" (click)="goToProfile()">
        <div class="user-avatar-mini">{{ userInitials }}</div>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
